<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AutoQA-Pro 测试报告</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: #409EFF; color: white; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .issue { padding: 10px; margin: 10px 0; background: #f5f5f5; }
        .critical { border-left: 4px solid #F56C6C; }
        .high { border-left: 4px solid #E6A23C; }
        .medium { border-left: 4px solid #409EFF; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ project_name }} - 自动化测试报告</h1>
        <p>执行时间: {{ timestamp }}</p>
    </div>
    
    <div class="section">
        <h2>测试概览</h2>
        <table>
            <tr><th>总问题数</th><td>{{ stats.total }}</td></tr>
            <tr><th>严重</th><td style="color:#F56C6C">{{ stats.critical }}</td></tr>
            <tr><th>高</th><td style="color:#E6A23C">{{ stats.high }}</td></tr>
            <tr><th>中</th><td style="color:#409EFF">{{ stats.medium }}</td></tr>
        </table>
    </div>
    
    <div class="section">
        <h2>问题列表</h2>
        {% for issue in issues %}
        <div class="issue {{ issue.severity }}">
            <h3>[{{ issue.severity|upper }}] {{ issue.type }}</h3>
            <p>{{ issue.description }}</p>
            <p><small>位置: {{ issue.location }}</small></p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
