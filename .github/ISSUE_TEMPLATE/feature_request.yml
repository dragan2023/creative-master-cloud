name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请说明背景与期望，帮助维护者理解你的需求。
  - type: textarea
    id: problem
    attributes:
      label: 背景与问题
      description: 你想解决什么问题？当前有哪些不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望的功能或行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方案（可选）
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 示例、草图、参考资料等（可选）
