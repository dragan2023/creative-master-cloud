# =============================================================================
# 后端 pytest 配置（修复计划 01 阶段 3.5 — 严格警告门禁）
#
# 门禁目标:
#   1. 测试函数 return 非 None（脚本式测试残留）→ 直接报错
#   2. 未注册 marker → 直接报错
#   3. 未处理协程（RuntimeWarning: coroutine ... was never awaited）→ 直接报错
#   4. 资源泄漏（ResourceWarning / PytestUnraisableExceptionWarning）→ 直接报错
#
# 白名单原则（见修复计划 3.5 第 2-3 条）:
#   - 仅允许"逐条、带模块范围"的第三方弃用警告白名单
#   - 禁止全局 ignore::DeprecationWarning
#   - 每条白名单必须注明: 触发模块 / 替换方案 / 移除条件
# =============================================================================
[pytest]
testpaths = tests

# pytest-asyncio: strict 模式（async 测试必须显式标注 @pytest.mark.asyncio）
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
    error::pytest.PytestUnknownMarkWarning
    error::pytest.PytestUnraisableExceptionWarning
    error::ResourceWarning
    error:coroutine .* was never awaited:RuntimeWarning
    # 自有代码(app.*)触发的弃用一律报错（如 datetime.utcnow / Pydantic class Config，均已修复，防回归）
    error::DeprecationWarning:app\.
