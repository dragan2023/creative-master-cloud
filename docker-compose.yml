version: '3.8'

services:
  # 后端服务
  backend:
    build: ./backend
    container_name: creative-master-backend
    command: /opt/venv/bin/uvicorn app.main:app --host ${HOST:-0.0.0.0} --port ${PORT:-8000}
    ports:
      - "${BACKEND_PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./backend/logs:/app/logs # 日志持久化
      - ./backend/data:/app/data # 数据持久化
    environment:
      # 应用配置
      - APP_NAME=${APP_NAME:-全能创意大师}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5173}
      - DEBUG=${DEBUG:-True}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      
      # 数据库配置
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/creative_master}
      
      # Redis配置
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      
      # JWT配置
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-./logs}
      
      # 向量数据库配置
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-./data/chroma}
      - CHROMA_MODEL_CACHE_DIR=${CHROMA_MODEL_CACHE_DIR:-./data/chroma/models}
      
      # 知识图谱配置
      - KNOWLEDGE_GRAPH_DIR=${KNOWLEDGE_GRAPH_DIR:-./data/knowledge_graphs}
      
      # 文档预处理配置
      - DOC_PREPROCESSOR_ENABLED=${DOC_PREPROCESSOR_ENABLED:-True}
      - MARKER_ENABLED=${MARKER_ENABLED:-True}
      - SEMANTIC_CHUNK_ENABLED=${SEMANTIC_CHUNK_ENABLED:-True}
      - SEMANTIC_CHUNK_SIZE=${SEMANTIC_CHUNK_SIZE:-1024}
      - SEMANTIC_THRESHOLD=${SEMANTIC_THRESHOLD:-0.7}
      - SUMMARIZATION_ENABLED=${SUMMARIZATION_ENABLED:-False}
      - MARKER_MODEL_DIR=${MARKER_MODEL_DIR:-./data/marker_models}
      
      # GPU配置
      - USE_GPU=${USE_GPU:-True}
      - GPU_DEVICE_ID=${GPU_DEVICE_ID:-0}
      - FORCE_GPU=${FORCE_GPU:-True}
      
      # 文件上传配置
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-209715200}
      - UPLOAD_DIR=${UPLOAD_DIR:-./data/uploads}
      - MAX_IMAGE_SIZE=${MAX_IMAGE_SIZE:-52428800}
      - MAX_DOC_SIZE=${MAX_DOC_SIZE:-52428800}
      
      # CORS配置
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
      # 知识库配置
      - TEMP_KNOWLEDGE_EXPIRE_HOURS=${TEMP_KNOWLEDGE_EXPIRE_HOURS:-24}
      
      # 版本管理配置
      - MAX_VERSION_HISTORY=${MAX_VERSION_HISTORY:-5}
      
      # LLM API Keys
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - ARK_API_KEY=${ARK_API_KEY:-}
      
      # Hugging Face配置
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      
      # 代理配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      
      # 前端配置（供后端返回给客户端）
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      - db
      - redis
    networks:
      - creative-network
    restart: unless-stopped

  # PostgreSQL 数据库
  db:
    image: postgres:13
    container_name: creative-master-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=creative_master
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - creative-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: creative-master-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - creative-network
    restart: unless-stopped

networks:
  creative-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
