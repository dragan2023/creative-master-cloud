name: creative-master

# ========================================
# 全能创意大师 - 本地开发环境配置
# 模拟阿里云端完整部署架构
# ========================================

services:
  # ==================== Nginx反向代理 ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: creative-master-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/app/static:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - creative-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 后端服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creative-master-backend
    entrypoint: ["/usr/local/bin/docker-entrypoint.dev.sh"]
    command: /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    expose:
      - "8000"
    volumes:
      - ./backend:/app                    # 完整后端目录映射
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - ./frontend:/app/frontend:ro       # 前端目录只读映射（用于参考）
      - ./nginx:/app/nginx:ro             # Nginx配置只读映射
      - ./.devcontainer:/app/.devcontainer:ro
      - ./.qoder:/app/.qoder:ro           # Qoder配置映射
    environment:
      # 应用配置
      - APP_NAME=${APP_NAME:-全能创意大师}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
      - DEBUG=${DEBUG:-True}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      
      # 数据库配置（Docker 环境使用服务名 db）
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/creative_master
      
      # Redis配置
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      
      # JWT配置
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - LOG_DIR=${LOG_DIR:-/app/logs}
      
      # === 知识库与向量数据库配置 ===
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-/app/data/chroma}
      - CHROMA_MODEL_CACHE_DIR=${CHROMA_MODEL_CACHE_DIR:-/app/data/chroma/models}
      - KNOWLEDGE_GRAPH_DIR=${KNOWLEDGE_GRAPH_DIR:-/app/data/knowledge_graphs}
      
      # 文档预处理配置
      - DOC_PREPROCESSOR_ENABLED=${DOC_PREPROCESSOR_ENABLED:-True}
      - MARKER_ENABLED=${MARKER_ENABLED:-True}
      - SEMANTIC_CHUNK_ENABLED=${SEMANTIC_CHUNK_ENABLED:-True}
      - SEMANTIC_CHUNK_SIZE=${SEMANTIC_CHUNK_SIZE:-1024}
      - SEMANTIC_THRESHOLD=${SEMANTIC_THRESHOLD:-0.7}
      - SUMMARIZATION_ENABLED=${SUMMARIZATION_ENABLED:-False}
      - MARKER_MODEL_DIR=${MARKER_MODEL_DIR:-/app/data/marker_models}
      
      # GPU配置
      - USE_GPU=${USE_GPU:-False}
      - GPU_DEVICE_ID=${GPU_DEVICE_ID:-0}
      - FORCE_GPU=${FORCE_GPU:-False}
      
      # 文件上传配置
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-209715200}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/data/uploads}
      - MAX_IMAGE_SIZE=${MAX_IMAGE_SIZE:-52428800}
      - MAX_DOC_SIZE=${MAX_DOC_SIZE:-52428800}
      
      # CORS配置
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
      # 知识库配置
      - TEMP_KNOWLEDGE_EXPIRE_HOURS=${TEMP_KNOWLEDGE_EXPIRE_HOURS:-24}
      
      # 版本管理配置
      - MAX_VERSION_HISTORY=${MAX_VERSION_HISTORY:-5}
      
      # LLM API Keys
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - ARK_API_KEY=${ARK_API_KEY:-}
      
      # === HuggingFace模型下载配置 ===
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/app/data/chroma/models}
      
      # 代理配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      
      # 前端配置
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      
      # 语言环境配置（解决中文乱码）
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
      
      # 时区配置
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - creative-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== PostgreSQL数据库 ====================
  db:
    image: postgres:15-alpine
    container_name: creative-master-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-creative_master}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/data/backups:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - creative-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-creative_master}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: creative-master-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - creative-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 数据库管理工具（可选）====================
  adminer:
    image: adminer:latest
    container_name: creative-master-adminer
    ports:
      - "8080:8080"
    networks:
      - creative-network
    restart: unless-stopped
    profiles:
      - tools

  # ==================== Redis管理工具（可选）====================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: creative-master-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - creative-network
    restart: unless-stopped
    profiles:
      - tools

networks:
  creative-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: